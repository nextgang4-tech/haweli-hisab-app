name: Build HAWELI Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Extract Project & Build HAWELI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Android Project from ZIP
        run: |
          unzip -o HAWELI-Android-Project.zip -d project
          # Move everything to root so Gradle works normally
          shopt -s dotglob
          mv project/* .
          rm -rf project
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew (if exists)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Generate Gradle Wrapper (missing in ZIP)
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload HAWELI APK
        uses: actions/upload-artifact@v4
        with:
          name: HAWELI-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
